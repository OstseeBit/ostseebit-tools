[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Same baseline as the Docker/nginx delivery path (nginx.conf) — not yet a
# final production sign-off, see docs/BASELINE.md / docs/ROADMAP.md Phase 5.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'"
