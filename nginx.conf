server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Sicherheits-Header stehen in einer eigenen Datei, weil nginx die add_header-Direktiven des
    # server-Blocks in jedem location-Block verwirft, der selbst add_header verwendet.
    # CSP ist bewusst locker genug für diese SPA (Vite-Build, keine Inline-Scripts außer dem
    # erzeugten Bundle).
    include /etc/nginx/snippets/security-headers.conf;

    # Komprimierung: ohne sie überträgt die Startseite ca. 1,3 MiB statt ca. 0,5 MiB.
    # woff2 ist bereits komprimiert und bleibt bewusst außen vor.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Gehashte Build-Dateien ändern sich unter gleichem Namen nie: ein Jahr, ohne Nachfrage.
    # Eine nicht (mehr) vorhandene Datei ist ein 404 und kein index.html mit Status 200.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Schriften haben keinen Hash im Namen, ändern sich aber praktisch nie.
    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Service Worker und Einstiegsseite müssen bei jedem Aufruf neu geprüft werden,
    # sonst kommen Updates nicht bei den Nutzern an. "no-cache" erlaubt weiterhin
    # bedingte Anfragen (304), es heißt nicht "nicht speichern".
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
