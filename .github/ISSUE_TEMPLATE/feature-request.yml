name: 🚀 Verbesserung oder neues Tool
description: Eine neue Funktion, Verbesserung oder Tool-Idee für OstseeBit Tools vorschlagen.
labels: ['enhancement', 'triage']

body:
  - type: markdown
    attributes:
      value: |
        Danke für dein Interesse an OstseeBit Tools und deinen Vorschlag.

  - type: dropdown
    id: request-type
    attributes:
      label: Um welche Art von Vorschlag handelt es sich?
      options:
        - Neues Tool
        - Neue Funktion für ein bestehendes Tool
        - Verbesserung an Deployment oder CI/CD
        - Verbesserung für Self-Hosting
        - Dokumentation
        - Sonstiges
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Beschreibung
      description: Beschreibe die gewünschte Funktion oder das neue Tool möglichst klar und konkret.
      placeholder: Beispiel: Ein zusätzliches Werkzeug für ...
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: Vergleichbare Lösungen oder Referenzen
      description: Falls es bereits ähnliche Webseiten, Anwendungen, CLI-Tools oder Bibliotheken gibt, können sie hier als Referenz verlinkt werden.

  - type: textarea
    id: additional-context
    attributes:
      label: Zusätzlicher Kontext
      description: Weitere Informationen, Screenshots oder technische Hinweise.

  - type: checkboxes
    id: checkboxes
    attributes:
      label: Vor dem Absenden
      description: Bitte prüfe die folgenden Punkte.
      options:
        - label: Die gewünschte Funktion ist noch nicht in OstseeBit Tools vorhanden.
          required: true
        - label: Es gibt noch kein offenes Issue mit demselben Vorschlag.
          required: true
        - label: Die Funktion kann grundsätzlich in einer clientseitigen Anwendung umgesetzt werden oder beschreibt ausdrücklich eine Änderung an Self-Hosting, Build oder Deployment.
          required: true
