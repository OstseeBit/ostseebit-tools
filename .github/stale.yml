# Anzahl der Tage ohne Aktivität, bevor ein Issue als veraltet markiert wird
daysUntilStale: 60
# Anzahl der Tage bis zum automatischen Schließen eines als veraltet markierten Issues
daysUntilClose: 7
# Issues mit diesen Labels werden nicht automatisch als veraltet markiert
exemptLabels:
  - pinned
  - security
# Label für als veraltet markierte Issues
staleLabel: wontfix
# Kommentar beim Markieren als veraltet
markComment: >
  Dieses Issue wurde automatisch als veraltet markiert, weil über einen längeren
  Zeitraum keine Aktivität stattgefunden hat. Wenn keine weitere Aktivität erfolgt,
  wird es geschlossen. Falls das Thema weiterhin relevant ist, ergänze bitte einen
  aktuellen Kommentar. Danke für deinen Beitrag zu OstseeBit Tools.
# Kein automatischer Abschlusskommentar
closeComment: false
