name: Validate application

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable repository package manager
        run: corepack enable
      - name: Install exact dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Lint, unit tests, typecheck and production build
        run: corepack pnpm check
      - name: Install test browsers
        run: corepack pnpm exec playwright install --with-deps
      - name: Test development cold start and functions
        run: corepack pnpm test:e2e:dev --project chromium --reporter line
      - name: Test production in all configured browsers
        run: corepack pnpm test:e2e --reporter line
      - name: Test offline PWA operation
        run: corepack pnpm test:pwa --reporter line
