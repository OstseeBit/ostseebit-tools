name: Publish Docker image

# Builds the container image and publishes it to Docker Hub:
#   - every push to main      -> tags "latest" and "sha-<commit>"
#   - every tag like v1.2.3   -> tags "1.2.3" and "1.2"
#   - manual run              -> from the Actions tab
# Without the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN the run is skipped (and stays
# green) so that merging does not fail before Docker Hub is set up. See docs/DOCKER.md.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Skip when Docker Hub is not configured
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        run: echo "::notice::Docker image not published, because the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set. See docs/DOCKER.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker image tags and labels
        id: meta
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Optional repository variable DOCKERHUB_IMAGE overrides the name, e.g. "my-organisation/ostseebit-tools".
          images: ${{ vars.DOCKERHUB_IMAGE || format('{0}/ostseebit-tools', secrets.DOCKERHUB_USERNAME) }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Date of the commit (shown in the app footer)
        id: build-info
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: echo "date=$(git log -1 --format=%cs)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.build-info.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
