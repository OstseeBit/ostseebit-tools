# Runs the published image on any Docker host:
#
#   1. docker compose up -d
#   2. Open http://<host>:8080
#
# Optional, in a file ".env" next to this file:
#   DOCKERHUB_USERNAME=...   use the image of another Docker Hub account (default: ostseebit)
#   OSTSEEBIT_TAG=...        pin a version, e.g. sha-a1b2c3d or 1.2.3 (default: latest)
#   OSTSEEBIT_PORT=...       host port (default: 8080)
#
# Update to the newest image:   docker compose pull && docker compose up -d

services:
  ostseebit-tools:
    image: ${DOCKERHUB_USERNAME:-ostseebit}/ostseebit-tools:${OSTSEEBIT_TAG:-latest}
    container_name: ostseebit-tools
    restart: unless-stopped
    ports:
      - "${OSTSEEBIT_PORT:-8080}:80"
