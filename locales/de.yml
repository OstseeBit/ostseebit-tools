about:
  title: Über
  content: >
    # Über OstseeBit Tools

    OstseeBit Tools wird von OstseeBit gepflegt. Die Sammlung bietet praktische Tools für Entwickler und Menschen, die in der IT arbeiten.

    Der Quellcode steht unter GNU GPLv3. Es besteht keine Gewährleistung. Lizenz und Herkunftshinweise sind im Repository verfügbar.

    Die Anwendung verwendet Vue 3, Naive UI und weitere Open-Source-Bibliotheken. Fehler und Vorschläge bitte im Repository melden.

    [GitHub](https://github.com/OstseeBit/ostseebit-tools) · [LICENSE](https://github.com/OstseeBit/ostseebit-tools/blob/main/LICENSE) · [NOTICE](https://github.com/OstseeBit/ostseebit-tools/blob/main/NOTICE.md)
