about:
  content: >
    # Про OstseeBit Tools

    OstseeBit Tools підтримує OstseeBit. Колекція містить корисні інструменти для розробників та ІТ-фахівців.

    Вихідний код поширюється за GNU GPLv3 без гарантій. Ліцензія та відомості про авторство доступні в репозиторії.

    Застосунок використовує Vue 3, Naive UI та інші бібліотеки з відкритим кодом. Повідомляйте про помилки та пропозиції в репозиторії.

    [GitHub](https://github.com/OstseeBit/ostseebit-tools) · [LICENSE](https://github.com/OstseeBit/ostseebit-tools/blob/main/LICENSE) · [NOTICE](https://github.com/OstseeBit/ostseebit-tools/blob/main/NOTICE.md)
