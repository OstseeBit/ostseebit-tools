about:
  content: >
    # Sobre OstseeBit Tools

    OstseeBit Tools é mantido pela OstseeBit. Oferece ferramentas úteis para desenvolvedores e profissionais de TI.

    O código-fonte é distribuído sob GNU GPLv3, sem garantia. A licença e os avisos de atribuição estão disponíveis no repositório.

    A aplicação utiliza Vue 3, Naive UI e outras bibliotecas de código aberto. Relate erros e sugestões no repositório.

    [GitHub](https://github.com/OstseeBit/ostseebit-tools) · [LICENSE](https://github.com/OstseeBit/ostseebit-tools/blob/main/LICENSE) · [NOTICE](https://github.com/OstseeBit/ostseebit-tools/blob/main/NOTICE.md)
